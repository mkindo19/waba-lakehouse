# =============================================================================
# WABA platform — valeurs par défaut (niveau 4)
# Aucun secret ici : ils viennent de helm/values-secrets.yaml, généré depuis .env (make k8s-secrets)
# et ignoré par git. Installation : make k8s-install  (= un seul helm upgrade --install)
# =============================================================================

# Un namespace par domaine (énoncé 4.1). Le chart est installé dans « processing » (--create-namespace) ;
# il crée les quatre autres.
namespaces:
  ingestion: ingestion        # NiFi, Kafka, Kafka UI, générateur
  processing: processing      # MinIO, catalogue Iceberg, Spark Operator, Airflow
  serving: serving            # Trino, Superset
  governance: governance      # Keycloak, OpenMetadata
  monitoring: monitoring      # Prometheus, Loki, Grafana

# Exposition des interfaces : Ingress NGINX (addon minikube). *.localtest.me pointe vers 127.0.0.1
# (DNS public) : aucun fichier hosts à modifier. Accès depuis Windows : make k8s-expose.
ingress:
  enabled: true
  className: nginx
  domain: localtest.me
  port: 8090                  # port local de make k8s-expose (80 souvent pris sous Windows)
  routes:
    - {host: minio, component: minio, domain: processing, service: minio, port: 9001}
    - {host: kafka-ui, component: kafkaUi, domain: ingestion, service: kafka-ui, port: 80}
    - {host: generator, component: generator, domain: ingestion, service: generator, port: 8501}
    - {host: nifi, component: nifi, domain: ingestion, service: nifi, port: 8080}
    - {host: trino, component: trino, domain: serving, service: trino, port: 8080}
    - {host: airflow, component: airflow, domain: processing, service: airflow-webserver, port: 8080}
    - {host: superset, component: superset, domain: serving, service: superset, port: 8088}

storageClass: standard        # provisionneur minikube (hostPath)

# Images construites localement (docker compose build) puis chargées dans minikube (make k8s-images).
# pullPolicy Never : erreur explicite (ErrImageNeverPull) si l'image n'a pas été chargée.
localImages:
  tag: dev
  pullPolicy: Never

s3:
  region: us-east-1

# Clés du Secret « waba-secrets » créé dans chaque namespace (valeurs dans values-secrets.yaml).
# Principe du moindre privilège : un namespace ne reçoit que les secrets dont il a besoin.
secretKeys:
  ingestion: [WABA_S3_ACCESS_KEY, WABA_S3_SECRET_KEY, NIFI_SENSITIVE_PROPS_KEY]
  processing: [MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, WABA_S3_ACCESS_KEY, WABA_S3_SECRET_KEY, PII_HASH_SALT,
               AIRFLOW_DB_PASSWORD, AIRFLOW_FERNET_KEY, AIRFLOW_WEBSERVER_SECRET_KEY,
               AIRFLOW_ADMIN_USER, AIRFLOW_ADMIN_PASSWORD]
  serving: [WABA_S3_ACCESS_KEY, WABA_S3_SECRET_KEY,
            SUPERSET_SECRET_KEY, SUPERSET_DB_PASSWORD, SUPERSET_ADMIN_USER, SUPERSET_ADMIN_PASSWORD]
  governance: []
  monitoring: []

# ----------------------------------------------------------------------------- processing
minio:
  enabled: true
  image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
  storage: 20Gi
  buckets: [raw-landing, lakehouse, archive]
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}

icebergRest:
  enabled: true
  image: tabulario/iceberg-rest:1.6.0
  storage: 1Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

# ----------------------------------------------------------------------------- ingestion
kafka:
  enabled: true
  image: apache/kafka:3.9.0
  clusterId: bxwqfjudTFGaDn0rT44cNQ
  storage: 10Gi
  heap: "-Xms512m -Xmx1g"
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {memory: 1536Mi}

kafkaUi:
  enabled: true
  image: provectuslabs/kafka-ui:v0.7.2
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 512Mi}

generator:
  enabled: true
  image: waba/generator
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1536Mi}            # génération des référentiels (500 000 clients) en mémoire

nifi:
  enabled: true
  image: apache/nifi:1.28.1
  storage: 10Gi
  heapInit: 512m
  heapMax: 1g
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {memory: 1792Mi}
  initImage: python:3.11-slim

# ----------------------------------------------------------------------------- serving
trino:
  enabled: true
  image: trinodb/trino:458
  heap: 1536M
  queryMaxMemory: 1GB
  queryMaxMemoryPerNode: 768MB
  resources:
    requests: {cpu: 250m, memory: 2Gi}
    limits: {memory: 2560Mi}

# Superset : dashboards sur Trino (énoncé 4.2). Dashboards « as code » : superset/dashboards/build_assets.py
superset:
  enabled: true
  image: waba/superset       # image officielle + pilote Trino + Authlib (cf. superset/Dockerfile)
  trinoUser: superset        # utilisateur Trino de la connexion (SSO Keycloak en 4.3)
  db:
    image: postgres:16-alpine
    storage: 1Gi
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}
  resources:
    requests: {cpu: 200m, memory: 768Mi}
    limits: {memory: 1536Mi}

# ----------------------------------------------------------------------------- Spark sur Kubernetes
# Spark Operator (sous-chart) : surveille le namespace processing et y lance les SparkApplication.
spark-operator:
  enabled: true
  spark:
    jobNamespaces: [processing]
    serviceAccount: {create: true, name: spark}     # compte utilisé par les drivers Spark
  controller:
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}
  webhook:
    enable: true            # nécessaire pour injecter volumes, variables et secrets dans les pods Spark
    # Ignore : un helm install complet crée la SparkApplication avant que le webhook soit prêt ; avec « Fail »
    # l'installation échoue (connection refused). Un pod créé sans mutation échoue et est relancé (restartPolicy).
    failurePolicy: Ignore
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {memory: 256Mi}

spark:
  image: waba/spark          # image maison (Iceberg, S3, Kafka, code des jobs), cf. spark/Dockerfile
  version: "3.5.3"
  checkpointStorage: 5Gi     # checkpoints du streaming (offsets Kafka + état), partagés driver / executors
  ghsPerEur: "14.6"
  driver: {cores: 1, memory: 1g}
  executor: {instances: 1, cores: 1, memory: 1g}
  streaming:
    rawToSilver:
      enabled: true
      name: stream-raw-to-silver
      file: stream_raw_to_silver.py
    fraudAml:
      enabled: true           # lit silver.customers / silver.accounts : 1er passage des DAGs fait avant (cf. D28)
      name: stream-fraud-aml
      file: stream_fraud_aml.py
  watermark: "2 days"
  liquidityMinCoverage: "0.98"
  # Jobs batch lancés par Airflow (une SparkApplication par tâche, modèle rendu dans le ConfigMap
  # airflow-spark-template). Supprimées par Spark Operator une heure après la fin (examen des échecs).
  batch:
    driver: {cores: 1, memory: 1g}
    # memoryOverhead : mémoire HORS tas Java du pod executor (workers Python, buffers réseau...). Avec 2 cœurs
    # = 2 workers Python ; 0.2 x 2g (410 Mo) ne suffisait pas -> OOMKilled (vécu, cf. D28).
    executor: {instances: 1, cores: 2, memory: 2g, memoryOverhead: 1g}
    shufflePartitions: "8"
    ttlSeconds: 3600

# ----------------------------------------------------------------------------- orchestration
airflow:
  enabled: true
  image: waba/airflow        # image maison (cf. airflow/Dockerfile) ; DAGs montés depuis un ConfigMap
  db:
    image: postgres:16-alpine
    storage: 2Gi             # base de métadonnées Airflow sur PVC (énoncé 4.1)
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}
  sparkPoolSlots: 1          # un job batch à la fois (mémoire du nœud minikube)
  webserverWorkers: 2
  scheduler:
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 2Gi}
  webserver:
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {memory: 1536Mi}
