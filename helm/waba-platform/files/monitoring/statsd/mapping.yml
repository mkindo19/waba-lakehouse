# statsd-exporter : métriques StatsD d'Airflow -> métriques Prometheus avec étiquettes (dag_id, task_id, état).
# Airflow émet par exemple « airflow.dagrun.duration.failed.dag_regulatory_report » (durée, en ms)
# et « airflow.ti.finish.dag_ingest_raw.raw_to_bronze.success » (compteur).
defaults:
  observer_type: histogram
mappings:
  - match: "airflow.dagrun.duration.*.*"
    name: airflow_dagrun_duration_seconds
    labels:
      status: "$1"
      dag_id: "$2"
  - match: "airflow.ti.finish.*.*.*"
    name: airflow_ti_finish
    labels:
      dag_id: "$1"
      task_id: "$2"
      state: "$3"
  - match: "airflow.dag.*.*.duration"
    name: airflow_task_duration_seconds
    labels:
      dag_id: "$1"
      task_id: "$2"
  - match: "airflow.scheduler_heartbeat"
    name: airflow_scheduler_heartbeat
  # le reste des métriques Airflow est conservé tel quel (préfixe airflow_)
