apiVersion: v2
name: waba-platform
description: >-
  WABA Group — plateforme lakehouse complète sur Kubernetes (niveau 4) : ingestion (NiFi, Kafka),
  traitement (MinIO, Iceberg, Spark Operator, Airflow), restitution (Trino, Superset),
  gouvernance (Keycloak, OpenMetadata) et supervision (Prometheus, Loki, Grafana).
type: application
version: 0.1.0
appVersion: "level4"

# Seule dépendance externe : Spark Operator (CRD SparkApplication + webhook), installé dans « processing ».
# `make k8s-deps` télécharge le chart dans charts/ (ignoré par git).
dependencies:
  - name: spark-operator
    version: "~2.1.0"
    repository: https://kubeflow.github.io/spark-operator
    condition: spark-operator.enabled
