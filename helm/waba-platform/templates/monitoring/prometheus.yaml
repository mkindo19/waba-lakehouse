{{- if .Values.monitoring.enabled }}
{{- $ns := include "waba.ns" (dict "ctx" $ "domain" "monitoring") }}
{{- $m := .Values.monitoring }}
# =============================================================================
# Prometheus (énoncé 4.4) : métriques de Spark, Kafka, NiFi, Airflow, Trino. Configuration :
# monitoring/prometheus/prometheus.yml (copiée dans le chart par make k8s-files). Données sur PVC, 7 jours.
# =============================================================================
# Découverte des pods à scraper (annotations prometheus.io/*) dans tous les namespaces : lecture seule.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: {{ $ns }}
  labels: {{- include "waba.component" (dict "ctx" $ "name" "prometheus") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: waba-prometheus
  labels: {{- include "waba.component" (dict "ctx" $ "name" "prometheus") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: waba-prometheus
  labels: {{- include "waba.component" (dict "ctx" $ "name" "prometheus") | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: waba-prometheus}
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: {{ $ns }}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ $ns }}
  labels: {{- include "waba.component" (dict "ctx" $ "name" "prometheus") | nindent 4 }}
data:
  {{- (.Files.Glob "files/monitoring/prometheus/*").AsConfig | nindent 2 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: {{ $ns }}
  labels: {{- include "waba.component" (dict "ctx" $ "name" "prometheus") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass }}
  resources: {requests: {storage: {{ $m.prometheus.storage }}}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ $ns }}
  labels: {{- include "waba.component" (dict "ctx" $ "name" "prometheus") | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}           # un seul processus sur la base TSDB (verrou)
  selector:
    matchLabels: {{- include "waba.selector" (dict "name" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "waba.component" (dict "ctx" $ "name" "prometheus") | nindent 8 }}
      annotations:
        checksum/config: {{ (.Files.Glob "files/monitoring/prometheus/*").AsConfig | sha256sum }}
    spec:
      serviceAccountName: prometheus
      initContainers:
        - name: chown                  # volume hostPath créé par root ; Prometheus tourne en « nobody »
          image: {{ $m.initImage }}
          command: [sh, -c, "chown -R 65534:65534 /prometheus"]
          volumeMounts:
            - {name: data, mountPath: /prometheus}
      containers:
        - name: prometheus
          image: {{ $m.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ $m.prometheus.retention }}
            - --web.enable-lifecycle
          ports:
            - {name: http, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources: {{- toYaml $m.prometheus.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          persistentVolumeClaim: {claimName: prometheus-data}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ $ns }}
  labels: {{- include "waba.component" (dict "ctx" $ "name" "prometheus") | nindent 4 }}
spec:
  selector: {{- include "waba.selector" (dict "name" "prometheus") | nindent 4 }}
  ports:
    - {name: http, port: 9090, targetPort: http}
{{- end }}
