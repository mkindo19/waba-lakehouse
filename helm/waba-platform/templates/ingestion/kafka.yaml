{{- if .Values.kafka.enabled }}
{{- $ns := include "waba.ns" (dict "ctx" $ "domain" "ingestion") }}
{{- $fqdn := include "waba.svc" (dict "ctx" $ "domain" "ingestion" "name" "kafka") }}
# Kafka 3.9 en mode KRaft (broker + contrôleur dans le même pod, sans Zookeeper), données sur PVC.
# StatefulSet : identité et volume stables d'un redémarrage à l'autre.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: {{ $ns }}
  labels: {{- include "waba.component" (dict "ctx" $ "name" "kafka") | nindent 4 }}
spec:
  selector: {{- include "waba.selector" (dict "name" "kafka") | nindent 4 }}
  ports:
    - {name: client, port: 9092, targetPort: client}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless               # DNS stable du pod (exigé par le StatefulSet)
  namespace: {{ $ns }}
  labels: {{- include "waba.component" (dict "ctx" $ "name" "kafka") | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "waba.selector" (dict "name" "kafka") | nindent 4 }}
  ports:
    - {name: client, port: 9092}
    - {name: controller, port: 9093}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: {{ $ns }}
  labels: {{- include "waba.component" (dict "ctx" $ "name" "kafka") | nindent 4 }}
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels: {{- include "waba.selector" (dict "name" "kafka") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "waba.component" (dict "ctx" $ "name" "kafka") | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000                  # l'image apache/kafka tourne avec l'utilisateur 1000
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          env:
            - {name: CLUSTER_ID, value: {{ .Values.kafka.clusterId | quote }}}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            # Adresse annoncée aux clients : le Service, joignable depuis tous les namespaces
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://{{ $fqdn }}:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_NUM_PARTITIONS, value: "3"}
            - {name: KAFKA_LOG_RETENTION_HOURS, value: "168"}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data}
            - {name: KAFKA_HEAP_OPTS, value: {{ .Values.kafka.heap | quote }}}
          ports:
            - {name: client, containerPort: 9092}
            - {name: controller, containerPort: 9093}
          # Readiness : le broker répond réellement au protocole Kafka (pas seulement le port ouvert)
          readinessProbe:
            exec:
              command: [/bin/bash, -c, "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 15
          # Liveness : port ouvert (moins coûteux) ; redémarre le pod s'il ne répond plus du tout
          livenessProbe:
            tcpSocket: {port: client}
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources: {{- toYaml .Values.kafka.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources: {requests: {storage: {{ .Values.kafka.storage }}}}
---
# Création idempotente des 11 topics (même script qu'en Docker Compose).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-topics
  namespace: {{ $ns }}
  labels: {{- include "waba.component" (dict "ctx" $ "name" "kafka-init") | nindent 4 }}
data:
  create-topics.sh: |-
{{ .Files.Get "files/kafka/create-topics.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  namespace: {{ $ns }}
  labels: {{- include "waba.component" (dict "ctx" $ "name" "kafka-init") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 15                     # réessaie tant que le broker n'est pas prêt
  template:
    metadata:
      labels: {{- include "waba.component" (dict "ctx" $ "name" "kafka-init") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: {{ .Values.kafka.image }}
          command: [/bin/bash, /scripts/create-topics.sh]
          env:
            - {name: KAFKA_BOOTSTRAP, value: "kafka:9092"}
          volumeMounts:
            - {name: scripts, mountPath: /scripts}
      volumes:
        - name: scripts
          configMap: {name: kafka-topics}
{{- end }}
