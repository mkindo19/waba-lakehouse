{{- if .Values.generator.enabled }}
{{- $ns := include "waba.ns" (dict "ctx" $ "domain" "ingestion") }}
# Générateur de données (Streamlit + CLI) : dépose les CSV dans MinIO raw-landing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: generator
  namespace: {{ $ns }}
  labels: {{- include "waba.component" (dict "ctx" $ "name" "generator") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "waba.selector" (dict "name" "generator") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "waba.component" (dict "ctx" $ "name" "generator") | nindent 8 }}
    spec:
      containers:
        - name: generator
          image: "{{ .Values.generator.image }}:{{ .Values.localImages.tag }}"
          imagePullPolicy: {{ .Values.localImages.pullPolicy }}
          env: {{- include "waba.s3Env" $ | nindent 12 }}
          ports:
            - {name: http, containerPort: 8501}
          readinessProbe:
            httpGet: {path: /_stcore/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /_stcore/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources: {{- toYaml .Values.generator.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: generator
  namespace: {{ $ns }}
  labels: {{- include "waba.component" (dict "ctx" $ "name" "generator") | nindent 4 }}
spec:
  selector: {{- include "waba.selector" (dict "name" "generator") | nindent 4 }}
  ports:
    - {name: http, port: 8501, targetPort: http}
{{- end }}
