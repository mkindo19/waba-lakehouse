{{- if .Values.trino.enabled }}
{{- $ns := include "waba.ns" (dict "ctx" $ "domain" "serving") }}
# Configuration de Trino (séparée du Deployment : sa somme de contrôle redémarre Trino à chaque changement)
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
  namespace: {{ $ns }}
  labels: {{- include "waba.component" (dict "ctx" $ "name" "trino") | nindent 4 }}
data:
  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port=8080
    # Derrière l'Ingress NGINX : accepter les en-têtes X-Forwarded-* (sinon erreur 406 dans le navigateur)
    http-server.process-forwarded=true
    discovery.uri=http://localhost:8080
    query.max-memory={{ .Values.trino.queryMaxMemory }}
    query.max-memory-per-node={{ .Values.trino.queryMaxMemoryPerNode }}
    {{- if and .Values.keycloak.enabled .Values.trino.sso }}
    {{- $kcPublic := printf "%s/realms/%s" (include "waba.publicUrl" (dict "ctx" $ "host" "keycloak")) .Values.keycloak.realm }}
    {{- $kcInternal := printf "http://%s:8080/realms/%s" (include "waba.svc" (dict "ctx" $ "domain" "governance" "name" "keycloak")) .Values.keycloak.realm }}
    # --- SSO Keycloak (énoncé 4.3, cf. D34) -------------------------------------------------------------
    # Utilisateurs : OAuth2 / OIDC (interface web, CLI, JDBC, client Python) sur HTTPS, terminé par l'Ingress
    # (https://trino.localtest.me:8443) ; Trino voit la requête « sécurisée » via X-Forwarded-Proto.
    http-server.authentication.type=oauth2
    web-ui.authentication.type=oauth2
    internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
    http-server.authentication.oauth2.client-id=trino
    http-server.authentication.oauth2.client-secret=${ENV:TRINO_OIDC_CLIENT_SECRET}
    http-server.authentication.oauth2.scopes=openid
    # Émetteur « iss » = URL publique ; le navigateur va sur l'URL publique, Trino appelle l'URL interne
    # (découverte OIDC désactivée : elle annoncerait des URL non résolubles depuis le pod)
    http-server.authentication.oauth2.issuer={{ $kcPublic }}
    http-server.authentication.oauth2.oidc.discovery=false
    http-server.authentication.oauth2.auth-url={{ $kcPublic }}/protocol/openid-connect/auth
    http-server.authentication.oauth2.end-session-url={{ $kcPublic }}/protocol/openid-connect/logout
    http-server.authentication.oauth2.token-url={{ $kcInternal }}/protocol/openid-connect/token
    http-server.authentication.oauth2.jwks-url={{ $kcInternal }}/protocol/openid-connect/certs
    # Identité Trino = nom d'utilisateur Keycloak ; groupes Keycloak (claim « groups ») -> règles d'accès
    http-server.authentication.oauth2.principal-field=preferred_username
    deprecated.http-server.authentication.oauth2.groups-field=groups
    # Comptes de service internes au cluster (HTTP 8080, sans mot de passe) : UNIQUEMENT ces noms. Tout autre
    # nom est refusé en HTTP : un humain ne peut pas se faire passer pour « admin.groupe » sans Keycloak.
    http-server.authentication.allow-insecure-over-http=true
    http-server.authentication.insecure.user-mapping.pattern=({{ join "|" .Values.trino.serviceUsers }})
    {{- end }}
  node.properties: |
    node.environment=waba
    node.data-dir=/data/trino
  {{- if and .Values.keycloak.enabled .Values.trino.sso }}
  # Autorisation par groupes Keycloak : règles « as code » (trino/security/rules.json, copié par make k8s-files)
  access-control.properties: |
    access-control.name=file
    security.config-file=/etc/trino/rules.json
  rules.json: |
{{ .Files.Get "files/trino-security/rules.json" | indent 4 }}
  {{- end }}
  log.properties: |
    io.trino=INFO
  jvm.config: |
    -server
    -Xmx{{ .Values.trino.heap }}
    -XX:InitialRAMPercentage=50
    -XX:+UseG1GC
    -XX:G1HeapRegionSize=32M
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+ExitOnOutOfMemoryError
    -XX:-OmitStackTraceInFastThrow
    -XX:ReservedCodeCacheSize=256M
    -Djdk.attach.allowAttachSelf=true
    -Djdk.nio.maxCachedBufferSize=2000000
    -Dfile.encoding=UTF-8
    -XX:+EnableDynamicAgentLoading
  # Catalogue Iceberg partagé avec Spark (même catalogue REST, même bucket). Secrets : variables d'env.
  iceberg.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://{{ include "waba.svc" (dict "ctx" $ "domain" "processing" "name" "iceberg-rest") }}:8181
    iceberg.rest-catalog.warehouse=s3://lakehouse/
    fs.native-s3.enabled=true
    s3.endpoint={{ include "waba.s3Endpoint" $ }}
    s3.region=${ENV:AWS_REGION}
    s3.path-style-access=true
    s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
    s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
  # Catalogue Kafka : topics lus comme des tables (schéma JSON décrit dans trino-kafka-topics)
  kafka.properties: |
    connector.name=kafka
    kafka.nodes={{ include "waba.svc" (dict "ctx" $ "domain" "ingestion" "name" "kafka") }}:9092
    kafka.default-schema=default
    kafka.table-names=raw-bank-transactions,silver-bank-transactions,dlq-financial-events,gold-fraud-alerts,gold-aml-events,gold-liquidity-alerts
    kafka.table-description-supplier=FILE
    kafka.table-description-dir=/etc/trino/kafka
    kafka.hide-internal-columns=false
---
# Description JSON des topics Kafka : mêmes fichiers qu'en Docker Compose (trino/kafka/, copiés par make k8s-files)
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-kafka-topics
  namespace: {{ $ns }}
  labels: {{- include "waba.component" (dict "ctx" $ "name" "trino") | nindent 4 }}
data:
{{ (.Files.Glob "files/trino-kafka/*.json").AsConfig | indent 2 }}
{{- end }}
