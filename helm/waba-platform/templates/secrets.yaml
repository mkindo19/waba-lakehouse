{{- /*
Secret « waba-secrets » de chaque namespace. Les VALEURS ne sont jamais dans le dépôt : elles viennent de
helm/values-secrets.yaml (généré depuis .env par scripts/k8s_values_secrets.py, ignoré par git).
`required` : l'installation échoue clairement si une clé manque, plutôt que de démarrer avec un secret vide.
*/}}
{{- range $domain, $keys := .Values.secretKeys }}
{{- if $keys }}
---
apiVersion: v1
kind: Secret
metadata:
  name: waba-secrets
  namespace: {{ index $.Values.namespaces $domain }}
  labels:
    {{- include "waba.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- range $key := $keys }}
  {{ $key }}: {{ required (printf "secret %s manquant : lancer make k8s-secrets" $key) (index ($.Values.secrets | default dict) $key) | quote }}
  {{- end }}
{{- end }}
{{- end }}
