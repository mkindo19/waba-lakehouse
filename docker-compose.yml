# WABA Group — Plateforme Lakehouse (niveaux 1 et 2 : Foundation + Orchestration)
# Lancement : docker compose up -d --build   (voir README)
name: waba

x-s3-env: &s3-env
  S3_ENDPOINT: http://minio:9000
  AWS_ACCESS_KEY_ID: ${WABA_S3_ACCESS_KEY}
  AWS_SECRET_ACCESS_KEY: ${WABA_S3_SECRET_KEY}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  RAW_BUCKET: raw-landing
  ARCHIVE_BUCKET: archive

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    args:
      SPARK_IMAGE: ${SPARK_IMAGE}
      AIRFLOW_IMAGE: ${AIRFLOW_IMAGE:-apache/airflow:2.10.5-python3.10}
      ICEBERG_VERSION: ${ICEBERG_VERSION}
  image: waba/airflow:${WABA_VERSION:-dev}
  environment:
    <<: *s3-env
    PII_HASH_SALT: ${PII_HASH_SALT}
    # --- Airflow : configuration par variables d'environnement (aucun secret en dur)
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    # --- Connection Airflow vers le cluster Spark (format JSON, Airflow >= 2.3)
    AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "spark://spark-master", "port": 7077}'
    # --- Variables Airflow (paramètres métier modifiables sans redéploiement)
    AIRFLOW_VAR_WABA_GHS_PER_EUR: ${WABA_GHS_PER_EUR:-14.6}
    # --- Spark côté Airflow (le driver tourne dans ce container)
    SPARK_CONF_DIR: /opt/airflow/spark-conf
    WABA_SPARK_JOBS_DIR: /opt/airflow/spark-jobs
    WABA_SPARK_DRIVER_HOST: airflow-scheduler
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./spark/jobs:/opt/airflow/spark-jobs:ro
    - ./spark/conf:/opt/airflow/spark-conf:ro
    - airflow-logs:/opt/airflow/logs
  user: "50000:0"
  networks: [waba]

x-spark-common: &spark-common
  build:
    context: ./spark
    args:
      SPARK_IMAGE: ${SPARK_IMAGE}
      ICEBERG_VERSION: ${ICEBERG_VERSION}
  image: waba/spark:${WABA_VERSION:-dev}
  environment:
    <<: *s3-env
    PII_HASH_SALT: ${PII_HASH_SALT}
    SPARK_CONF_DIR: /opt/waba/spark-conf
  volumes:
    - ./spark/jobs:/opt/spark-apps        # code monté : pas besoin de rebuild à chaque modif
    - ./spark/conf:/opt/waba/spark-conf:ro   # dossier (et non fichier) : robuste aux remplacements de fichiers
  networks: [waba]
  depends_on:
    iceberg-rest:
      condition: service_healthy

services:
  # ---------------------------------------------------------------- stockage objet
  minio:
    image: ${MINIO_IMAGE}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [waba]
    restart: unless-stopped

  minio-init:
    image: ${MINIO_MC_IMAGE}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      WABA_S3_ACCESS_KEY: ${WABA_S3_ACCESS_KEY}
      WABA_S3_SECRET_KEY: ${WABA_S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "/scripts/init.sh"]
    volumes:
      - ./infra/minio:/scripts:ro   # dossier monté (un fichier seul casse si on le remplace sous WSL)
    networks: [waba]
    restart: "no"

  # ---------------------------------------------------------------- catalogue Iceberg
  iceberg-rest:
    image: ${ICEBERG_REST_IMAGE}
    user: "0:0"   # écriture du fichier SQLite du catalogue sur le volume (dev local uniquement)
    environment:
      <<: *s3-env
      CATALOG_WAREHOUSE: s3://lakehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      # WAL : les lectures ne bloquent plus les écritures ; busy_timeout : un écrivain ATTEND jusqu'à 30 s
      # que le verrou se libère au lieu d'échouer immédiatement (SQLITE_BUSY), cf. D22
      CATALOG_URI: jdbc:sqlite:file:/catalog/iceberg_catalog.db?journal_mode=WAL&busy_timeout=30000
    volumes:
      - iceberg-catalog:/catalog
    ports:
      - "8181:8181"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8181/v1/config || wget -qO- http://localhost:8181/v1/config || bash -c 'exec 3<>/dev/tcp/127.0.0.1/8181'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [waba]
    restart: unless-stopped

  # ---------------------------------------------------------------- calcul Spark
  spark-master:
    <<: *spark-common
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      <<: *s3-env
      PII_HASH_SALT: ${PII_HASH_SALT}
      SPARK_CONF_DIR: /opt/waba/spark-conf
      SPARK_MASTER_HOST: spark-master
    ports:
      - "7077:7077"
      - "8090:8080"   # UI Spark master
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  spark-worker:
    <<: *spark-common
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      <<: *s3-env
      PII_HASH_SALT: ${PII_HASH_SALT}
      SPARK_CONF_DIR: /opt/waba/spark-conf
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-8}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-10g}
    volumes:
      - ./spark/jobs:/opt/spark-apps
      - ./spark/conf:/opt/waba/spark-conf:ro
      # Niveau 3 : l'état des requêtes de streaming (dédoublonnage, fenêtres) est écrit par les executors
      - spark-checkpoints:/opt/spark-checkpoints
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8091:8081"   # UI Spark worker

  # ---------------------------------------------------------------- SQL Trino
  trino:
    image: ${TRINO_IMAGE}
    environment:
      <<: *s3-env
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    ports:
      - "${TRINO_PORT:-8088}:8080"   # 8080 souvent déjà pris sur le poste (Airflow, Tomcat...)
    depends_on:
      iceberg-rest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]   # script fourni par l'image officielle
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [waba]
    restart: unless-stopped

  # ---------------------------------------------------------------- générateur Streamlit
  generator:
    build: ./generator
    image: waba/generator:${WABA_VERSION:-dev}
    environment:
      <<: *s3-env
    ports:
      - "8501:8501"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks: [waba]
    restart: unless-stopped

  # ---------------------------------------------------------------- orchestration Airflow (niveau 2)
  airflow-db:
    image: ${AIRFLOW_DB_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [waba]
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    # Idempotent : migration de la base, compte admin, pool Spark
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create --role Admin --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname WABA --lastname Admin --email admin@waba.local || true
        airflow pools set spark_pool 1 "Un seul job Spark a la fois (ressources du worker)"
        echo "Airflow initialise"
    environment:
      <<: *s3-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    hostname: airflow-scheduler          # nom DNS utilisé par les executors Spark pour joindre le driver
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 30s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
    restart: unless-stopped

  # ================================================================ NIVEAU 3 : streaming
  # Profil "streaming" : ces services ne démarrent qu'avec `make up-streaming`
  # (docker compose --profile streaming up -d), pour économiser la mémoire sinon.

  # ---------------------------------------------------------------- bus de messages Kafka
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.0}
    profiles: ["streaming"]
    hostname: kafka
    environment:
      # Mode KRaft : un seul nœud joue broker ET contrôleur (plus de Zookeeper)
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-bxwqfjudTFGaDn0rT44cNQ}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 3 écoutes : PLAINTEXT (containers du réseau waba), EXTERNAL (ton PC), CONTROLLER (interne KRaft)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Un seul broker : facteur de réplication 1 pour les topics internes
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Les topics sont créés explicitement (kafka-init) : pas de topic créé par une faute de frappe
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168          # 7 jours par défaut
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"   # accès depuis le PC (outils locaux)
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks: [waba]
    restart: unless-stopped

  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.0}
    profiles: ["streaming"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./infra/kafka:/scripts:ro              # dossier monté (cf. D16)
    networks: [waba]
    restart: "no"

  kafka-ui:
    image: ${KAFKA_UI_IMAGE:-provectuslabs/kafka-ui:v0.7.2}
    profiles: ["streaming"]
    environment:
      KAFKA_CLUSTERS_0_NAME: waba
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"          # 8080 déjà pris sur le poste
    depends_on:
      kafka:
        condition: service_healthy
    networks: [waba]
    restart: unless-stopped

  # ---------------------------------------------------------------- collecte temps réel NiFi
  nifi:
    image: ${NIFI_IMAGE:-apache/nifi:1.28.1}
    profiles: ["streaming"]
    hostname: nifi
    environment:
      # HTTP sans authentification : poste local uniquement (au niveau 4 : HTTPS + Keycloak)
      NIFI_WEB_HTTP_PORT: 8080
      NIFI_WEB_HTTP_HOST: 0.0.0.0
      NIFI_WEB_PROXY_HOST: "localhost:${NIFI_PORT:-8089},nifi:8080,localhost:8080"
      # Clé de chiffrement des propriétés sensibles (secret MinIO) dans le flux NiFi
      NIFI_SENSITIVE_PROPS_KEY: ${NIFI_SENSITIVE_PROPS_KEY}
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 2g
    ports:
      - "${NIFI_PORT:-8089}:8080"
    volumes:                                   # flux, état de ListS3 et files d'attente survivent aux redémarrages
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-state:/opt/nifi/nifi-current/state
      - nifi-database:/opt/nifi/nifi-current/database_repository
      - nifi-flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi-content:/opt/nifi/nifi-current/content_repository
      - nifi-provenance:/opt/nifi/nifi-current/provenance_repository
    healthcheck:                               # port ouvert ; deploy_flow.py attend ensuite que l'API réponde
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [waba]
    restart: unless-stopped

  nifi-init:
    # Déploie le flux NiFi versionné (infra/nifi/deploy_flow.py) via l'API REST : idempotent
    image: ${NIFI_INIT_IMAGE:-python:3.11-slim}
    profiles: ["streaming"]
    command: ["python", "-u", "/scripts/deploy_flow.py"]
    environment:
      <<: *s3-env
      NIFI_API: http://nifi:8080/nifi-api
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./infra/nifi:/scripts:ro
    depends_on:
      nifi:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks: [waba]
    restart: "no"

  # ---------------------------------------------------------------- Spark Structured Streaming
  # Job 1 : raw-* -> silver-* (Kafka) + silver.rt_* (Iceberg). Le driver tourne dans ce container,
  # les executors sur spark-worker (1 cœur réservé en permanence : spark.cores.max=1).
  stream-raw-to-silver:
    <<: *spark-common
    profiles: ["streaming"]
    hostname: stream-raw-to-silver
    command:
      - /opt/spark/bin/spark-submit
      - --master=spark://spark-master:7077
      - --conf=spark.driver.host=stream-raw-to-silver
      - --conf=spark.driver.memory=1g
      - --conf=spark.cores.max=1
      - --conf=spark.executor.cores=1
      - --conf=spark.executor.memory=1g
      - --conf=spark.sql.shuffle.partitions=4
      - /opt/spark-apps/stream_raw_to_silver.py
    environment:
      <<: *s3-env
      SPARK_CONF_DIR: /opt/waba/spark-conf
      KAFKA_BOOTSTRAP: kafka:9092
      WABA_GHS_PER_EUR: ${WABA_GHS_PER_EUR:-14.6}
    volumes:
      - ./spark/jobs:/opt/spark-apps
      - ./spark/conf:/opt/waba/spark-conf:ro
      - spark-checkpoints:/opt/spark-checkpoints
    depends_on:
      spark-master:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped          # une requête en échec -> le container redémarre et reprend au checkpoint

volumes:
  spark-checkpoints:
  minio-data:
  iceberg-catalog:
  airflow-db-data:
  airflow-logs:
  kafka-data:
  nifi-conf:
  nifi-state:
  nifi-database:
  nifi-flowfile:
  nifi-content:
  nifi-provenance:

networks:
  waba:
    name: waba
