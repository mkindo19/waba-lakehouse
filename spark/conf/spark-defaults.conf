# --- Catalogue Iceberg "lakehouse" (REST) --------------------------------------
spark.sql.extensions                                org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lakehouse                         org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type                    rest
spark.sql.catalog.lakehouse.uri                     http://iceberg-rest:8181
spark.sql.catalog.lakehouse.warehouse               s3://lakehouse/
spark.sql.catalog.lakehouse.io-impl                 org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.endpoint             http://minio:9000
spark.sql.catalog.lakehouse.s3.path-style-access    true
spark.sql.defaultCatalog                            lakehouse

# --- Lecture des fichiers bruts (s3a) -------------------------------------------
# Identifiants lus dans l'environnement (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) : rien en dur
spark.hadoop.fs.s3a.endpoint                        http://minio:9000
spark.hadoop.fs.s3a.path.style.access               true
spark.hadoop.fs.s3a.connection.ssl.enabled          false
spark.hadoop.fs.s3a.aws.credentials.provider        com.amazonaws.auth.EnvironmentVariableCredentialsProvider

# --- Ressources (le worker dispose de SPARK_WORKER_MEMORY=6g) -------------------
spark.driver.memory                                 2g
spark.executor.memory                               4g
spark.executor.cores                                4
spark.memory.fraction                               0.7
# Nettoyage automatique des checkpoints quand ils ne sont plus référencés
spark.cleaner.referenceTracking.cleanCheckpoints    true

# --- Divers ---------------------------------------------------------------------
spark.sql.session.timeZone                          UTC
spark.sql.shuffle.partitions                        16
spark.sql.adaptive.enabled                          true
spark.eventLog.enabled                              false
